name: Python reference

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "implementations/python/**"
      - "schema/**"
      - "profiles/agent/**"
      - "conformance/**"
      - "mappings/controls/**"
      - ".github/workflows/python-reference.yml"
  pull_request:
    paths:
      - "implementations/python/**"
      - "schema/**"
      - "profiles/agent/**"
      - "conformance/**"
      - "mappings/controls/**"
      - ".github/workflows/python-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-reference:
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11.16"
          - "3.14.7"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python reference dependencies
        working-directory: implementations/python
        run: python -m pip install -r requirements.txt

      - name: Run Python reference conformance
        working-directory: implementations/python
        run: python -m unittest discover -s test -p '*_test.py'
