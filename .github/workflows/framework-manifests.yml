name: Framework manifests

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "adapters/**"
      - "schema/framework-adapter-manifest.schema.json"
      - "tools/conformance/validate_framework_adapters.py"
      - "tools/conformance/validate_extension_layout.py"
      - ".github/workflows/framework-manifests.yml"
  pull_request:
    paths:
      - "adapters/**"
      - "schema/framework-adapter-manifest.schema.json"
      - "tools/conformance/validate_framework_adapters.py"
      - "tools/conformance/validate_extension_layout.py"
      - ".github/workflows/framework-manifests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: pip install -r tools/conformance/requirements.txt

      - name: Validate extension layout
        run: python tools/conformance/validate_extension_layout.py

      - name: Validate framework adapter manifests
        run: python tools/conformance/validate_framework_adapters.py
