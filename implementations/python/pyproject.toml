[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auditspec-reference"
version = "0.1.0.dev0"
description = "Executable Python reference implementation for AuditSpec v0.1"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.25,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["auditspec_ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
